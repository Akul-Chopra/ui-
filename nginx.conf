server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip the text assets; the JS bundle is the bulk of the payload.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache the fingerprinted build assets; they are content-hashed so a new build
    # produces new file names and never serves a stale bundle from cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Developer documents and other non-app files are never served, even if one ends up in
    # the image by mistake.
    location ~* \.(md|doc|docx|xls|xlsx|sql|log|bak|env|map)$ {
        return 404;
    }

    # The API and SignalR hub are proxied to the backend service, so the browser makes
    # same-origin requests and the SPA needs no CORS grant. The address comes from the
    # VPS_API_UPSTREAM environment variable (default http://api:8080, see the Dockerfile);
    # nginx fills it in when the container starts.
    location /api/ {
        proxy_pass ${VPS_API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass ${VPS_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback: any unmatched path returns index.html so client-side routing works on
    # a deep link or a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
